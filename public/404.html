<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada · 404 | MovieClub</title>
  <link rel="icon" type="image/png" href="/img/logoMovieClub.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .notfound-wrapper {
      position: relative;
      min-height: 100vh;
      background: #101519 url('/img/img404') center right / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .notfound-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(16, 21, 25, 0.78) 0%, rgba(16, 21, 25, 0.45) 45%, rgba(16, 21, 25, 0.05) 80%, transparent 100%);
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .notfound-overlay {
        background: rgba(16, 21, 25, 0.75);
      }
    }
  </style>
</head>
<body class="min-vh-100 m-0 p-0">

  <main class="notfound-wrapper">
    <div class="notfound-overlay"></div>
    <div class="container-xl px-4 px-md-5 position-relative pt-5">
      <div class="row">
        <div class="col-lg-5 col-md-7">

          <div class="mb-4">
            <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none">
              <img src="/img/logoMovieClub.png" alt="MovieClub" height="36">
              <span class="brand-title h3 mb-0 text-white">MOVIECLUB</span>
            </a>
          </div>

          <h1 class="h4 text-white fw-bold mb-2" style="font-family: var(--font-body); letter-spacing: 0.01em; line-height: 1.3;">
            Lo sentimos, no podemos encontrar la página que solicitaste.
          </h1>

          <p class="text-secondary small mb-4" style="line-height: 1.6; font-size: 0.95rem;">
            ¿Quizás la imaginaste? Por favor volvé al inicio si el problema persiste.
          </p>

          <p class="text-secondary opacity-75 small mb-0" style="font-size: 0.8rem;">
            Fotograma de <em>Fight Club</em> (1999), dirigida por David Fincher.
          </p>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
