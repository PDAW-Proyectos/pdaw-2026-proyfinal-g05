<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta · MovieClub</title>
  <link rel="icon" type="image/png" href="/img/logoMovieClub.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-split-wrapper">
    
  
    <div class="auth-visual-panel auth-visual-panel-register d-none d-lg-flex">
      <div class="auth-visual-overlay"></div>
      <div class="auth-visual-content">
        <div>
          <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none">
            <img src="/img/logoMovieClub.png" alt="MovieClub" height="38">
            <span class="brand-title h3 mb-0">MOVIECLUB</span>
          </a>
        </div>

        <div class="mt-auto">
          <div class="text-pink small fw-bold text-uppercase mb-2" style="letter-spacing: 0.18em;">
            Comunidad
          </div>
          <h1 class="auth-visual-title mb-2">
            EL CINE NO SE DISFRUTA EN SILENCIO.
          </h1>
          <p class="text-secondary mb-0" style="max-width: 450px; font-size: 1.05rem; line-height: 1.4;">
            Registrá lo que ves, descubrí tu próxima obsesión y encontrá a tu gente.
          </p>
        </div>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-container">
        
        <div class="d-lg-none text-center mb-4">
          <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none">
            <img src="/img/logoMovieClub.png" alt="MovieClub" height="34">
            <span class="brand-title h4 mb-0">MOVIECLUB</span>
          </a>
        </div>

        <div>
          <h2 class="auth-title">UNITE AL CLUB</h2>
          <p class="auth-subtitle">Creá tu cuenta de cinéfilo en segundos y empezá tu registro.</p>
        </div>

        <div id="alerta-error" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="form-registro" novalidate>
          <div class="mb-3">
            <label for="nombre" class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 0.06em;">
              Nombre de usuario
            </label>
            <div class="auth-input-wrapper">
              <i class="bi bi-person input-icon"></i>
              <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Tu alias o apodo de cinéfilo" autocomplete="username">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 0.06em;">
              Correo Electrónico
            </label>
            <div class="auth-input-wrapper">
              <i class="bi bi-envelope input-icon"></i>
              <input type="email" class="form-control" id="email" name="email" required placeholder="nombre@ejemplo.com" autocomplete="email">
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 0.06em;">
              Contraseña
            </label>
            <div class="auth-input-wrapper">
              <i class="bi bi-lock input-icon"></i>
              <input type="password" class="form-control" id="password" name="password" required placeholder="Mínimo 6 caracteres" autocomplete="new-password">
              <button type="button" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="rol" class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 0.06em;">
              Rol en el Club
            </label>
            <div class="auth-input-wrapper">
              <i class="bi bi-shield-check input-icon"></i>
              <select class="form-select" id="rol" name="rol" required>
                <option value="Espectador" selected>Espectador</option>
                <option value="Critico">Crítico de Cine</option>
                <option value="Moderador">Moderador</option>
              </select>
            </div>
          </div>

          <div class="mb-4 d-none" id="campo-medio-prensa">
            <label for="medioDePrensa" class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 0.06em;">
              Medio de Prensa
            </label>
            <div class="auth-input-wrapper">
              <i class="bi bi-newspaper input-icon"></i>
              <input type="text" class="form-control" id="medioDePrensa" name="medioDePrensa" placeholder="Ej. Revista Rolling Stone, La Nación">
            </div>
          </div>

          <button type="submit" class="btn btn-pink w-100 py-2.5 mt-2">
            Crear Cuenta
          </button>
        </form>

        <div class="text-center pt-4">
          <span class="text-secondary small">¿Ya tenés una cuenta?</span>
          <a href="/login.html" class="text-pink small fw-bold text-decoration-none ms-1">Iniciar sesión</a>
        </div>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.btn-toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
      });
    });

    const selectRol = document.getElementById('rol');
    const campoMedio = document.getElementById('campo-medio-prensa');
    if (selectRol && campoMedio) {
      selectRol.addEventListener('change', () => {
        if (selectRol.value === 'Critico') {
          campoMedio.classList.remove('d-none');
        } else {
          campoMedio.classList.add('d-none');
        }
      });
    }
  </script>
</body>
</html>
